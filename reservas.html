<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas HULK CROSSTRAINING</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --bg2: #111; --bg3: #1a1a1a;
  --red: #d10f0b; --red-dark: #a00c08; --red-glow: rgba(209,15,11,0.35);
  --green: #3b8c3a; --green-glow: rgba(59,140,58,0.25);
  --white: #fff; --text: rgba(255,255,255,0.88); --text-muted: rgba(255,255,255,0.55);
  --border: rgba(255,255,255,0.08); --card-bg: rgba(255,255,255,0.03);
  --font-display: 'Oswald', sans-serif; --font-body: 'Roboto', sans-serif;
}
html, body { height: 100%; }
body {
  font-family: var(--font-body); background: var(--bg); color: var(--text);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.btn {
  display: inline-block; padding: 12px 32px; border: none; border-radius: 4px;
  font-family: var(--font-display); font-size: 1rem; font-weight: 600; text-transform: uppercase;
  cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
}
.btn-red { background: var(--red); color: white; }
.btn-red:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: 0 4px 20px var(--red-glow); }
.btn-red:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 6px 16px; font-size: 0.8rem; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--red); color: var(--red); }
input { 
  width: 100%; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text); font-size: 1rem; outline: none; transition: 0.3s;
}
input:focus { border-color: var(--red); }

/* ── APP ── */
.app { max-width: 900px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
.header h1 { font-size: 1.5rem; color: var(--red); }
.header h1 span { color: var(--white); }
.user-info { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--text-muted); }

/* ── AUTH SCREEN ── */
.auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; }
.auth-box { width: 100%; max-width: 400px; padding: 40px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; }
.auth-box h2 { text-align: center; margin-bottom: 8px; }
.auth-box p { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem; }
.auth-box .field { margin-bottom: 16px; }
.auth-box .btn { width: 100%; margin-top: 8px; }
.auth-switch { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--text-muted); }
.auth-switch a { color: var(--red); cursor: pointer; text-decoration: none; }
.auth-switch a:hover { text-decoration: underline; }
.error { color: var(--red); text-align: center; font-size: 0.85rem; margin-top: 8px; display: none; }

/* ── SCHEDULE ── */
.schedule-view { flex: 1; }
.dia-nav { display: flex; gap: 4px; margin-bottom: 24px; overflow-x: auto; }
.dia-btn { padding: 8px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); cursor: pointer; font-family: var(--font-body); font-size: 0.8rem; text-transform: uppercase; white-space: nowrap; transition: 0.3s; }
.dia-btn:hover { border-color: var(--red); color: var(--text); }
.dia-btn.active { background: var(--red); border-color: var(--red); color: white; }
.dia-btn.today { border-color: var(--green); }
.dia-btn.pasado { opacity: 0.3; pointer-events: none; }

.classes { display: flex; flex-direction: column; gap: 8px; }
.class-card { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; transition: 0.3s; }
.class-card:hover { border-color: var(--border); }
.class-card .info { flex: 1; }
.class-card .hora { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
.class-card .tipo { font-size: 0.8rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.class-card .aforo { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
.class-card .aforo .lleno { color: var(--red); }
.class-card .aforo .bien { color: var(--green); }
.class-card .booked { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
.class-card .booked span { display: inline-block; background: var(--bg3); padding: 2px 8px; border-radius: 3px; margin: 2px; font-size: 0.7rem; }
.class-card .booked .mio { border: 1px solid var(--red); color: var(--red); }
.class-card .actions { margin-left: 16px; }

/* ── MIS RESERVAS ── */
.mis-reservas { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
.mis-reservas h3 { margin-bottom: 12px; font-size: 1rem; color: var(--text-muted); }
.reserva-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--bg3); border-radius: 4px; margin-bottom: 6px; font-size: 0.85rem; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 6px; font-size: 0.9rem; z-index: 999; opacity: 0; transition: 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.ok { background: var(--green); color: white; }
.toast.err { background: var(--red); color: white; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .app { padding: 12px; }
  .header h1 { font-size: 1.1rem; }
  .class-card { flex-direction: column; align-items: flex-start; gap: 10px; }
  .class-card .actions { margin-left: 0; width: 100%; }
  .class-card .actions .btn { width: 100%; text-align: center; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <h1>HULK <span>RESERVAS</span></h1>
    <div class="user-info" id="userInfo" style="display:none">
      <span id="userName"></span>
      <button class="btn btn-sm btn-outline" onclick="logout()">Salir</button>
    </div>
  </div>

  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>Accede a tus reservas</h2>
      <p>Inicia sesión para reservar tus clases</p>
      <div class="field"><input type="email" id="loginEmail" placeholder="Email" autocomplete="email"></div>
      <div class="field"><input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password"></div>
      <div class="error" id="loginError"></div>
      <button class="btn btn-red" onclick="login()">Entrar</button>
      <div class="auth-switch">¿No tienes cuenta? <a onclick="showRegister()">Regístrate</a></div>
    </div>
  </div>

  <!-- Register Screen -->
  <div class="auth-screen" id="registerScreen" style="display:none">
    <div class="auth-box">
      <h2>Crear cuenta</h2>
      <p>Regístrate para reservar clases en HULK</p>
      <div class="field"><input type="text" id="regName" placeholder="Nombre completo"></div>
      <div class="field"><input type="email" id="regEmail" placeholder="Email" autocomplete="email"></div>
      <div class="field"><input type="password" id="regPass" placeholder="Contraseña (mín 4 caracteres)" autocomplete="new-password"></div>
      <div class="error" id="regError"></div>
      <button class="btn btn-red" onclick="register()">Crear cuenta</button>
      <div class="auth-switch">¿Ya tienes cuenta? <a onclick="showLogin()">Inicia sesión</a></div>
    </div>
  </div>

  <!-- Schedule View -->
  <div class="schedule-view" id="scheduleView" style="display:none">
    <div class="dia-nav" id="diaNav"></div>
    <div class="classes" id="classesList"></div>
    <div class="mis-reservas" id="misReservas"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const API = "https://66d4-46-26-135-158.ngrok-free.app";

// ── STATE ──
let token = localStorage.getItem("hulk_token") || "";
let user = null;
let schedule = {};
let currentDate = "";
const DIAS = ["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
const DIAS_SHORT = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
const DIA_KEY = [0,1,2,3,4,5,6]; // 0=domingo...6=sábado - para mapeo con API

async function api(path, opts={}) {
  const headers = {"Content-Type": "application/json", "ngrok-skip-browser-warning": "true"};
  if (token) headers["Authorization"] = `Bearer ${token}`;
  try {
    const r = await fetch(API + path, { ...opts, headers });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Error");
    return data;
  } catch(e) {
    showToast(e.message, "err");
    throw e;
  }
}

function showToast(msg, type="ok") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove("show"), 3000);
}

// ── AUTH ──
async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  if (!email || !pass) { err.textContent = "Completa todos los campos"; err.style.display = "block"; return; }
  try {
    const data = await api("/api/login", { method: "POST", body: JSON.stringify({email, password: pass}) });
    token = data.token;
    user = data.user;
    localStorage.setItem("hulk_token", token);
    err.style.display = "none";
    initApp();
  } catch(e) { err.textContent = e.message; err.style.display = "block"; }
}

async function register() {
  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const pass = document.getElementById("regPass").value;
  const err = document.getElementById("regError");
  if (!name || !email || !pass) { err.textContent = "Completa todos los campos"; err.style.display = "block"; return; }
  try {
    const data = await api("/api/register", { method: "POST", body: JSON.stringify({name, email, password: pass}) });
    token = data.token;
    user = data.user;
    localStorage.setItem("hulk_token", token);
    err.style.display = "none";
    initApp();
  } catch(e) { err.textContent = e.message; err.style.display = "block"; }
}

function logout() {
  token = ""; user = null;
  localStorage.removeItem("hulk_token");
  showAuth();
}

function showAuth() {
  document.getElementById("authScreen").style.display = "flex";
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("scheduleView").style.display = "none";
  document.getElementById("userInfo").style.display = "none";
}

function showRegister() {
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("registerScreen").style.display = "flex";
  document.getElementById("scheduleView").style.display = "none";
}

function showLogin() {
  showAuth();
}

// ── APP ──
async function initApp() {
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("scheduleView").style.display = "block";
  document.getElementById("userInfo").style.display = "flex";
  document.getElementById("userName").textContent = user.name;
  
  schedule = await api("/api/schedule");
  
  // Ir al día de hoy o al próximo día con clases
  const today = new Date();
  currentDate = today.toISOString().split('T')[0];
  
  renderDias();
  await loadDay(currentDate);
  await loadMisReservas();
}

function renderDias() {
  const nav = document.getElementById("diaNav");
  nav.innerHTML = "";
  const today = new Date();
  
  // Mostrar próximos 14 días
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const dateStr = d.toISOString().split('T')[0];
    const diaSem = d.getDay(); // 0=domingo
    const diaKey = diaSem === 0 ? 6 : diaSem - 1; // nuestro mapping: lunes=0
    // En la API SCHEDULE: domingo=0, lunes=1..sábado=6
    const apiDia = diaSem; // domingo=0 en JS y en nuestra API
    
    const hasClasses = schedule[apiDia] && schedule[apiDia].length > 0;
    if (!hasClasses && i > 6) continue; // Solo mostrar días sin clases cerca
    
    const btn = document.createElement("button");
    btn.className = "dia-btn";
    if (d.toDateString() === today.toDateString()) btn.classList.add("today");
    if (d < new Date(today.getFullYear(), today.getMonth(), today.getDate())) btn.classList.add("pasado");
    if (dateStr === currentDate) btn.classList.add("active");
    
    btn.innerHTML = `${DIAS_SHORT[diaSem]}<br><small>${d.getDate()}/${d.getMonth()+1}</small>`;
    btn.onclick = () => selectDay(dateStr);
    nav.appendChild(btn);
  }
}

function selectDay(dateStr) {
  currentDate = dateStr;
  document.querySelectorAll(".dia-btn").forEach(b => b.classList.remove("active"));
  // Highlight active
  const btns = document.getElementById("diaNav").children;
  for (let b of btns) {
    if (b.textContent.includes(dateStr.split('-')[2])) b.classList.add("active");
  }
  loadDay(dateStr);
}

async function loadDay(dateStr) {
  const container = document.getElementById("classesList");
  container.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">Cargando...</p>';
  
  const d = new Date(dateStr + "T12:00:00");
  const diaSem = d.getDay();
  
  try {
    const data = await api(`/api/reservas/${dateStr}`);
    const slots = schedule[diaSem] || [];
    
    if (slots.length === 0) {
      container.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">No hay clases este día</p>';
      return;
    }
    
    // Mapa de reservas por hora
    const resByHour = {};
    (data.clases || []).forEach(c => { resByHour[c.hora] = c; });
    
    container.innerHTML = "";
    slots.forEach(slot => {
      const res = resByHour[slot.hora] || {count: 0, reservados: []};
      const lleno = res.count >= slot.max;
      const pct = slot.max > 0 ? Math.round((res.count / slot.max) * 100) : 0;
      const usersList = res.reservados || [];
      const yaReservado = usersList.some(u => u.es_mio);
      const esPasado = new Date(dateStr + "T23:59:59") < new Date();
      
      const card = document.createElement("div");
      card.className = "class-card";
      
      card.innerHTML = `
        <div class="info">
          <div class="hora">${slot.hora}</div>
          <div class="tipo">${slot.tipo}</div>
          <div class="aforo">
            ${lleno ? '<span class="lleno">COMPLETO</span>' : `<span class="bien">${slot.max - res.count} plazas libres</span>`}
            (${res.count}/${slot.max})
          </div>
          <div class="booked">
            ${usersList.map(u => `<span class="${u.es_mio ? 'mio' : ''}">${u.user_name}</span>`).join('')}
          </div>
        </div>
        <div class="actions">
          ${esPasado ? '' : (yaReservado 
            ? `<button class="btn btn-sm btn-outline" onclick="cancelarReserva(${usersList.find(u=>u.es_mio).id})">Cancelar</button>`
            : (lleno ? `<button class="btn btn-sm btn-red" disabled>Lleno</button>`
              : `<button class="btn btn-sm btn-red" onclick="reservar('${dateStr}','${slot.hora}','${slot.tipo}')">Reservar</button>`))
          }
        </div>
      `;
      container.appendChild(card);
    });
  } catch(e) {
    container.innerHTML = `<p style="color:var(--red);text-align:center;padding:40px;">Error al cargar: ${e.message}</p>`;
  }
}

async function reservar(fecha, hora, tipo) {
  try {
    await api("/api/reservar", { method: "POST", body: JSON.stringify({fecha, hora, tipo}) });
    showToast("✅ Reserva confirmada");
    await loadDay(fecha);
    await loadMisReservas();
  } catch(e) {}
}

async function cancelarReserva(id) {
  if (!confirm("¿Cancelar esta reserva?")) return;
  try {
    await api(`/api/cancelar/${id}`, { method: "DELETE" });
    showToast("Reserva cancelada");
    await loadDay(currentDate);
    await loadMisReservas();
  } catch(e) {}
}

async function loadMisReservas() {
  const container = document.getElementById("misReservas");
  try {
    const reservas = await api("/api/mis-reservas");
    if (reservas.length === 0) {
      container.innerHTML = '<div class="mis-reservas"><h3>Mis reservas</h3><p style="color:var(--text-muted);font-size:0.85rem;">No tienes reservas próximas</p></div>';
      container.style.display = "block";
      return;
    }
    
    container.innerHTML = `
      <h3>Mis próximas reservas</h3>
      ${reservas.map(r => `
        <div class="reserva-item">
          <span><strong>${r.fecha}</strong> · ${r.hora} · ${r.tipo}</span>
          <button class="btn btn-sm btn-outline" onclick="cancelarReserva(${r.id})">Cancelar</button>
        </div>
      `).join('')}
    `;
    container.style.display = "block";
  } catch(e) {}
}

// ── INIT ──
if (token) {
  // Verificar token válido
  api("/api/schedule").then(s => {
    schedule = s;
    user = {name: "..."};
    document.getElementById("userName").textContent = "Cargando...";
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("scheduleView").style.display = "block";
    document.getElementById("userInfo").style.display = "flex";
    
    // Obtener datos reales del usuario via una llamada
    api("/api/mis-reservas").then(() => {
      // Token válido, obtener datos
      initApp();
    }).catch(() => {
      token = ""; localStorage.removeItem("hulk_token"); showAuth();
    });
  }).catch(() => {
    token = ""; localStorage.removeItem("hulk_token"); showAuth();
  });
}
</script>
</body>
</html>
